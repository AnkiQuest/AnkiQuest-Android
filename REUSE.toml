version = 1

# make FileCopyrightText optional on all .kt files
# see docs/contributing/copyright-headers.md
[[annotations]]
path = "**.kt"
precedence = "aggregate"
SPDX-FileCopyrightText = "Contributors to the AnkiDroid project"

# Archived Anki-tan exports, kept with their licence. See
# docs/art-archive/anki-tan/README.md and docs/art-archive/anki-tan/LICENSE.
[[annotations]]
path = "docs/art-archive/anki-tan/*.webp"
precedence = "override"
SPDX-FileCopyrightText = "Shigeyuki <https://www.patreon.com/Shigeyuki>"
SPDX-License-Identifier = "CC-BY-SA-4.0"
