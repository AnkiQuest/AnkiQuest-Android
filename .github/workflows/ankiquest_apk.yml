# SPDX-License-Identifier: AGPL-3.0-or-later
name: ankiquest APK

# A documentation-only push to master builds no nightly, with paths-ignore: this is not a required
# check and does not run in the merge queue. GitHub does not apply path filters to tag pushes, so
# every quest-* tag still builds. The globs are the documentation list of ankiquest_lint.yml's
# changes job (.github/tests/docs-only.test.cjs); they leave out the release notes in the app's
# assets, which ship in the APK.
on:
  push:
    branches: [master]
    tags: ["quest-*"]
    paths-ignore:
      - '*.md'
      - '*/README.md'
      - '*/*/README.md'
      - '.agents/**/*.md'
      - '.github/workflows/README.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.idea/**/*.md'
      - '.oss-scanner/*.md'
      - 'LICENSE*'
      - 'LICENSES/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ankiquest-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  # Gradle retries HTTP 429 and 5xx, by default 3 tries 1s and 2s apart. Maven Central's rate
  # limit lasts longer than that, so try 7 times with doubling waits from 2s (about 2 minutes).
  GRADLE_OPTS: -Dorg.gradle.internal.repository.max.tentatives=7 -Dorg.gradle.internal.repository.initial.backoff=2000
  # The ABI splits in AnkiDroid/build.gradle.kts, each published as AnkiQuest-<abi>.apk.
  ABIS: arm64-v8a armeabi-v7a x86_64 x86

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # publishes the release and the nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No Gradle cache: the release and the nightly are built from a clean
      # cache, so nothing a cache entry holds can reach the published APK.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Release number
        id: release
        run: |
          nightly=0
          if [[ "$GITHUB_REF" == refs/tags/quest-* ]]; then
            number="${GITHUB_REF#refs/tags/quest-}"
            [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::tag must be quest-<number>"; exit 1; }
          elif tag=$(git describe --tags --match 'quest-[0-9]*' --abbrev=0 HEAD 2>/dev/null); then
            number="${tag#quest-}"
            nightly=$(git rev-list --count --first-parent "$tag..HEAD")
            if [ "$nightly" -gt 999 ]; then
              echo "::error::$nightly commits since $tag; tag a release so nightly builds keep upgrading"
              exit 1
            fi
          else
            number=0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"

      # The newest upstream AnkiDroid commit merged into this build, for the debug info.
      # Upstream merges keep upstream history, so the merge base with upstream main is that commit.
      - name: Upstream commit
        id: upstream
        run: |
          git fetch --no-tags https://github.com/ankidroid/Anki-Android.git main
          sha=$(git merge-base HEAD FETCH_HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The full flavor for GitHub: one APK per ABI plus the universal AnkiQuest.apk, whose
      # name released self-updaters download. The ABI APKs follow upstream's split config and
      # version codes. The play flavor goes to Google Play as an app bundle, without the
      # self-updater, since Play forbids apps updating themselves (#319).
      - name: Assemble
        env:
          RELEASE: ${{ steps.release.outputs.number }}
          NIGHTLY: ${{ steps.release.outputs.nightly }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "fatal_warnings=false" >> local.properties
          quest=(-Pankiquest -PcustomName="AnkiQuest" -PankiquestRelease="$RELEASE"
            -PankiquestNightly="$NIGHTLY" -PupstreamCommit="$UPSTREAM_SHA")
          ./gradlew :AnkiDroid:assembleFullRelease -Duniversal-apk=true --stacktrace -PankiquestUpdates=github "${quest[@]}"
          ./gradlew :AnkiDroid:bundlePlayRelease --stacktrace -PankiquestUpdates=none "${quest[@]}"
          cp AnkiDroid/build/outputs/apk/full/release/AnkiDroid-full-universal-release.apk AnkiQuest.apk
          for abi in $ABIS; do
            cp "AnkiDroid/build/outputs/apk/full/release/AnkiDroid-full-$abi-release.apk" "AnkiQuest-$abi.apk"
          done
          cp AnkiDroid/build/outputs/bundle/playRelease/AnkiDroid-play-release.aab AnkiQuest.aab

      # F-Droid rebuilds each release from docs/fdroid/recipe.yml and publishes our APK when its
      # rebuild matches it apart from the signature (Binaries in the recipe). The Gradle inputs
      # are the recipe's (fdroid.test.cjs): no self-updater, universal APK. Package and Sign
      # below check and sign it like the GitHub APKs: the AnkiQuest key alone.
      - name: F-Droid APK
        if: startsWith(github.ref, 'refs/tags/quest-')
        env:
          RELEASE: ${{ steps.release.outputs.number }}
          UPSTREAM: ${{ steps.upstream.outputs.sha }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./gradlew :AnkiDroid:assembleFullRelease -Duniversal-apk=true --stacktrace \
            -Pankiquest=true -PcustomName=AnkiQuest -PankiquestUpdates=none -PankiquestArtCache=ankiquest-art \
            -PankiquestRelease="$RELEASE" -PupstreamCommit="$UPSTREAM"
          cp AnkiDroid/build/outputs/apk/full/release/AnkiDroid-full-universal-release.apk fdroid.apk

      # Packaging failed now and then with no cause printed; free disk and memory rule those out.
      - name: Disk and memory
        if: failure()
        run: |
          df -h
          free -m

      # The AnkiQuest key alone signs only org.ankiquest.ankidroid. The old package needs the
      # rotation lineage from the public test key, which this workflow no longer applies, so an
      # APK of any other package stops the build before signing.
      - name: Package
        env:
          PACKAGE: org.ankiquest.ankidroid
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          for apk in AnkiQuest.apk AnkiQuest-*.apk fdroid.apk; do
            [ -f "$apk" ] || continue
            package=$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            if [ "$package" != "$PACKAGE" ]; then
              echo "::error::$apk has package $package, not $PACKAGE"
              exit 1
            fi
          done

      # Every published APK is signed with the AnkiQuest key alone, on every scheme, no test key and
      # no rotation lineage. apksigner replaces the fallback key's signature Gradle wrote. The
      # bundle is jar-signed with the AnkiQuest key as its upload key until Play has an upload key
      # of its own (#319).
      - name: Sign with the AnkiQuest release key
        id: sign
        env:
          ANKIQUEST_KEYSTORE: ${{ secrets.ANKIQUEST_KEYSTORE }}
          ANKIQUEST_KEY_PASSWORD: ${{ secrets.ANKIQUEST_KEY_PASSWORD }}
          RELEASE_CERTIFICATE_SHA256: b397a61ecfaf0fe354da611772515e683ccb6fd0e952d477b8b3bca49e6c490d
        run: |
          if [ -z "$ANKIQUEST_KEYSTORE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/quest-* ]]; then
              echo "::error::ANKIQUEST_KEYSTORE is required to sign a release"
              exit 1
            fi
            echo "::warning::No ANKIQUEST_KEYSTORE; this build stays on the public fallback key"
            exit 0
          fi
          keystore=$(mktemp "$RUNNER_TEMP/ankiquest.XXXXXX.jks")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANKIQUEST_KEYSTORE" | base64 -d > "$keystore"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in AnkiQuest.apk AnkiQuest-*.apk fdroid.apk; do
            [ -f "$apk" ] || continue
            "$apksigner" sign --ks "$keystore" --ks-key-alias ankiquest --ks-pass env:ANKIQUEST_KEY_PASSWORD "$apk"
            "$apksigner" verify --min-sdk-version 24 "$apk"

            # The verifier reports the newest signer for a range. Check each scheme's first
            # supported API separately: one certificate, the AnkiQuest key, and no lineage.
            for api in 24 28 33; do
              certificates=$("$apksigner" verify --min-sdk-version "$api" --max-sdk-version "$api" --print-certs "$apk")
              digests=$(printf '%s\n' "$certificates" | awk '/^(V[^ ]+ )?Signer.*certificate SHA-256 digest:/ {print $NF}' | sort -u)
              if [ "$digests" != "$RELEASE_CERTIFICATE_SHA256" ]; then
                echo "::error::$apk on Android API $api must use the AnkiQuest release certificate alone"
                exit 1
              fi
            done
          done

          # Replace the fallback key's jar signature on the bundle.
          zip -q -d AnkiQuest.aab 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
          jarsigner -keystore "$keystore" -storepass:env ANKIQUEST_KEY_PASSWORD \
            -keypass:env ANKIQUEST_KEY_PASSWORD AnkiQuest.aab ankiquest
          jarsigner -verify -certs -verbose AnkiQuest.aab | grep "CN=AnkiQuest" > /dev/null
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Each ABI APK adds its upstream ABI number times 10^8 to the universal version code
      # (build.gradle.kts), so updates stay within one ABI and never downgrade.
      - name: Version code
        id: version
        env:
          RELEASE: ${{ steps.release.outputs.number }}
          NIGHTLY: ${{ steps.release.outputs.nightly }}
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          code_of() { "$aapt2" dump badging "$1" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p"; }
          version_code=$(code_of AnkiQuest.apk)
          echo "versionCode $version_code (quest-$RELEASE + $NIGHTLY)"
          if [ "$RELEASE" -gt 0 ] && [ "$version_code" -ne $((50000000 + RELEASE * 1000 + NIGHTLY)) ]; then
            echo "::error::versionCode $version_code does not match quest-$RELEASE + $NIGHTLY"
            exit 1
          fi
          declare -A abi_digit=([armeabi-v7a]=1 [x86]=2 [arm64-v8a]=3 [x86_64]=4)
          for abi in $ABIS; do
            code=$(code_of "AnkiQuest-$abi.apk")
            if [ "$code" -ne $((abi_digit[$abi] * 100000000 + version_code)) ]; then
              echo "::error::AnkiQuest-$abi.apk has versionCode $code, expected ${abi_digit[$abi]} * 10^8 + $version_code"
              exit 1
            fi
          done
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      # The download list for the release notes and nightly.json, most common first.
      - name: Assets
        id: assets
        run: |
          # org.ankiquest.ankidroid publishes no AnkiDroid-Quest.apk: that name is for updaters of
          # the old package, whose final release is quest-24. Its updater finds AnkiQuest.apk here
          # and shows the move notice instead of installing another package.
          files=(AnkiQuest-arm64-v8a.apk AnkiQuest.apk AnkiQuest-armeabi-v7a.apk AnkiQuest-x86_64.apk AnkiQuest-x86.apk AnkiQuest.aab)
          for file in "${files[@]}"; do
            jq -n --arg name "$file" --argjson size "$(stat -c %s "$file")" '{name: $name, size: $size}'
          done | jq -s . > assets.json
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo
            echo "## Downloads"
            echo
            echo "- \`AnkiQuest-arm64-v8a.apk\`: most phones."
            echo "- \`AnkiQuest.apk\`: every device. Pick this if unsure."
            echo "- \`AnkiQuest-armeabi-v7a.apk\`: older 32-bit phones."
            echo "- \`AnkiQuest-x86_64.apk\`, \`AnkiQuest-x86.apk\`: emulators and Chromebooks."
            echo "- \`AnkiQuest.aab\`: app bundle for Google Play, not for installing."
          } > downloads.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ankiquest
          path: |
            AnkiQuest.apk
            AnkiQuest-*.apk
            AnkiQuest.aab
          if-no-files-found: error

      - name: Check the migration release
        if: steps.sign.outputs.signed == 'true' && (startsWith(github.ref, 'refs/tags/quest-') || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull requests squash-merge, so check the tag's files, not its ancestry. Only the final
          # old-package source has all three: the export provider, the updater's move notice and
          # the current-signer check.
          bridge=refs/tags/quest-24:AnkiDroid/src/main/java/com/ichi2/anki/ankiquest
          signer=b397a61ecfaf0fe354da611772515e683ccb6fd0e952d477b8b3bca49e6c490d
          if ! git cat-file -e "$bridge/AnkiquestMoveProvider.kt" \
            || ! git grep -q -F 'Download.MOVED' "$bridge/AnkiquestUpdater.kt" \
            || ! git grep -q -F "RELEASE_SHA256 = \"$signer\"" "$bridge/AnkiquestMove.kt"; then
            echo "::error::quest-24 must contain the old-package settings bridge, updater notice and signer check"
            exit 1
          fi
          if ! git grep -q -F 'applicationId = "com.ichi2.anki"' refs/tags/quest-24 -- AnkiDroid/build.gradle.kts; then
            echo "::error::quest-24 must use the legacy app's base ID"
            exit 1
          fi
          if ! gh release view quest-24 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            | jq -e '(.isDraft == false) and (.isPrerelease == false) and
                ([.assets[].name] | contains(["AnkiQuest.apk", "AnkiDroid-Quest.apk"]))' > /dev/null; then
            echo "::error::Publish the final migration release as quest-24 with both legacy download names first"
            exit 1
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/quest-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ steps.release.outputs.number }}
        run: |
          cat AnkiDroid/src/main/assets/ankiquest/release-notes.md downloads.md > notes.md
          gh release create "$GITHUB_REF_NAME" $(jq -r '.[].name' assets.json) \
            --title "AnkiQuest $RELEASE" \
            --notes-file notes.md

      # The recipe's Binaries URL names the APK by version code, since F-Droid only substitutes
      # the version code and name, not the tag. Not in assets.json: the release lists the GitHub
      # APKs, and the fdroid pre-release is never the latest one the updater reads.
      - name: Publish F-Droid APK
        if: startsWith(github.ref, 'refs/tags/quest-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          code=$("$aapt2" dump badging fdroid.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          mv fdroid.apk "AnkiQuest-$code.apk"
          if ! gh release view fdroid > /dev/null 2>&1; then
            gh release create fdroid --prerelease --latest=false --title "AnkiQuest for F-Droid" \
              --notes "APKs F-Droid checks its builds against, one per release. Install AnkiQuest from F-Droid or from the quest-* releases instead."
          fi
          gh release upload fdroid "AnkiQuest-$code.apk" --clobber

      - name: Nightly manifest
        id: nightly
        if: github.ref == 'refs/heads/master' && steps.sign.outputs.signed == 'true' && steps.release.outputs.number != '0'
        env:
          RELEASE: ${{ steps.release.outputs.number }}
          NIGHTLY: ${{ steps.release.outputs.nightly }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          jq -n --argjson release "$RELEASE" --argjson nightly "$NIGHTLY" --argjson version_code "$VERSION_CODE" \
            --arg commit "$GITHUB_SHA" --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson size "$(stat -c %s AnkiQuest.apk)" --slurpfile assets assets.json \
            '{release: $release, nightly: $nightly, version_code: $version_code, commit: $commit, built_at: $built_at, size: $size, assets: $assets[0]}' \
            > nightly.json
          {
            echo "Built from $GITHUB_SHA after quest-$RELEASE. Untested: pick the nightly update channel in AnkiQuest settings to get these."
            cat downloads.md
          } > notes.md

      # Updates the release in place and retries the release API; see the action.
      - name: Publish nightly
        if: steps.nightly.outcome == 'success'
        uses: AnkiQuest/AnkiQuest-Dev/.github/actions/nightly-release@master
        with:
          title: AnkiQuest nightly
          notes-file: notes.md
          files: |
            ${{ steps.assets.outputs.files }}
            nightly.json
