# SPDX-License-Identifier: AGPL-3.0-only
# Tests tools/ankiquest-packages, the tool that moves AnkiQuest's code to org.ankiquest.
name: ankiquest packages tool

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ankiquest_packages.yml"
      - "tools/ankiquest-packages/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/ankiquest_packages.yml"
      - "tools/ankiquest-packages/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/ankiquest-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image ships rustup; install a minimal stable toolchain explicitly.
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/ankiquest-packages

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
