# SPDX-License-Identifier: AGPL-3.0-or-later
# zizmor's security audit of every workflow and action here, upstream's
# included, with the rules in .github/zizmor.yml. It runs in AnkiQuest-Dev's
# default shell (the android shell has no zizmor), through the shared
# nix-check.yml, and reports as `zizmor / check`. No path filter, so a
# ruleset can require it.
name: ankiquest zizmor

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run gets a group of
  # its own and always finishes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/nix-check.yml@master
    with:
      flake: github:AnkiQuest/AnkiQuest-Dev
      flake-check: false
      format: ""
      zizmor: true
      timeout-minutes: 15
