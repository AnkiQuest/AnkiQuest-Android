name: ankiquest workflow regression tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ankiquest_*.yml"
      - ".github/tests/*.test.cjs"
      - ".github/wait_for_screenshot_baseline.js"
      - ".github/workflows/lint.yml"
      - ".github/workflows/screenshot_*.yml"
      - ".github/workflows/tests_*.yml"
      - ".github/ankiquest_server_*.cjs"
      - "AnkiDroid/src/test/resources/ankiquest-server.sha"
      - "AnkiDroid/src/test/resources/ankiquest-api/names.json"
      - ".github/tests/labels.test.cjs"
      - ".github/labeler.yml"
      - ".github/dependabot.yml"
      - "docs/graphics/banner.toml"
      # upstream-backend.test.cjs: files that could name a backend artifact
      - "gradle/**"
      - "**/*.gradle.kts"
      - "buildSrc/**"
      - "**/*.md"
  # Pull requests run from pull_request; pushing their branch would run the same tests again.
  push:
    branches: [master]
    paths:
      - ".github/workflows/ankiquest_*.yml"
      - ".github/tests/*.test.cjs"
      - ".github/wait_for_screenshot_baseline.js"
      - ".github/workflows/lint.yml"
      - ".github/workflows/screenshot_*.yml"
      - ".github/workflows/tests_*.yml"
      - ".github/ankiquest_server_*.cjs"
      - "AnkiDroid/src/test/resources/ankiquest-server.sha"
      - "AnkiDroid/src/test/resources/ankiquest-api/names.json"
      - ".github/tests/labels.test.cjs"
      - ".github/labeler.yml"
      - ".github/dependabot.yml"
      - "docs/graphics/banner.toml"
      # upstream-backend.test.cjs: files that could name a backend artifact
      - "gradle/**"
      - "**/*.gradle.kts"
      - "buildSrc/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run (master pushes,
  # schedules, dispatches, merge queue) gets a group of its own and always finishes (#269).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test repository workflows
        run: node --test .github/tests/*.test.cjs
