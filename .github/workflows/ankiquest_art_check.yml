# SPDX-License-Identifier: AGPL-3.0-or-later
name: ankiquest art check

# Every companion picture committed under AnkiDroid's drawables must be, byte for byte, the
# exported copy in the pinned AnkiQuest-Art release (ankiquest-art.json): the check downloads that
# release's android-drawables.zip, verifies its pinned SHA-256 and compares each picture. A picture
# the release lacks or one with other bytes fails, so hand-made or stale copies cannot ship.
on:
  pull_request:
  # The merge queue runs it on its merge commit too.
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run (master pushes,
  # schedules, dispatches, merge queue) gets a group of its own and always finishes (#269).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  art:
    name: App art is the pinned Art release's
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the app's companion pictures with the pinned release
        shell: bash
        run: node .github/ankiquest_art_check.cjs check
