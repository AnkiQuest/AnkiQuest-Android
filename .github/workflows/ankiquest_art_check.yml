name: ankiquest art check

# No companion picture is committed: the build unpacks them from the android-drawables.zip of the
# AnkiQuest-Art release ankiquest-art.json pins. This checks that zip's SHA-256 and entries, that no
# companion picture is committed under AnkiDroid/src or docs, and that every companion drawable
# the app names is in the release.
on:
  pull_request:
  # The merge queue runs it on its merge commit too.
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run (master pushes,
  # schedules, dispatches, merge queue) gets a group of its own and always finishes (#269).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  art:
    name: App art comes from the pinned Art release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the app's companion art against the pinned release
        shell: bash
        run: node .github/ankiquest_art_check.cjs check
