# SPDX-License-Identifier: AGPL-3.0-only
name: ankiquest art check

# Runs the server's art exporter against the app's drawables, at the server commit pinned in
# ankiquest-server.sha. It builds and runs the server's code, so it only runs for pull requests,
# merge queue groups and pushes, never on a schedule or by hand: a manual server ref would run
# arbitrary code with the Rust cache shared with master.
on:
  pull_request:
  # Required check: the merge queue waits for it on its merge commit.
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run (master pushes,
  # schedules, dispatches, merge queue) gets a group of its own and always finishes (#269).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  art:
    name: App art matches the server's exporter
    runs-on: ubuntu-latest
    # The byte check (AnkiQuest/AnkiQuest-Server#56) encodes every drawable.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Check against the pinned server commit (#203), so a server merge cannot turn master red;
      # the bump PR brings exporter changes in.
      - name: Read the immutable server pin
        id: server-ref
        run: echo "ref=$(node .github/ankiquest_server_snapshot.cjs ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnkiQuest/AnkiQuest-Server
          ref: ${{ steps.server-ref.outputs.ref }}
          path: server
          persist-credentials: false

      # The runner image ships rustup; install a minimal stable toolchain explicitly.
      - name: Set up Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server

      # A server without the exporter fails here instead of skipping the check.
      - name: Check the app's art against the server's exporter
        shell: bash
        run: (cd server && cargo run -q -p ankiquest-xtask -- export-android-art --check "$GITHUB_WORKSPACE")
