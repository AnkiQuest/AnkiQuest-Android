# SPDX-License-Identifier: AGPL-3.0-or-later
name: ankiquest art check

# The app draws its companions from the AnkiQuest-Art release ankiquest-art.json pins: packs as
# assets, launcher icons from android-drawables.zip, both fetched by the build (BundleAnkiquestPacks).
# This checks that no companion picture is committed and that every pinned asset the build fetches
# downloads with the pinned SHA-256.
on:
  pull_request:
  # The merge queue waits for it on its merge commit.
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run (master pushes,
  # schedules, dispatches, merge queue) gets a group of its own and always finishes (#269).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  art:
    name: App art comes from the pinned Art release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Companion pictures are exported copies; AnkiQuest-Art releases are their only source.
      - name: No companion picture is committed
        shell: bash
        run: |
          found=$(git ls-files 'AnkiDroid/src/*' | grep -E '/(aki|ankilope|anki_tan|bluma|cow|duo)_[a-z0-9_]*\.(webp|png)$' || true)
          if [ -n "$found" ]; then echo "Committed companion pictures:"; echo "$found"; exit 1; fi

      - name: The pinned assets match their SHA-256
        shell: bash
        run: |
          tag=$(jq -r .tag ankiquest-art.json)
          jq -r '.assets | to_entries[] | select(.key | test("^(packs\\.json|pack-[a-z0-9_]+\\.zip|android-drawables\\.zip)$")) | "\(.value)  \(.key)"' ankiquest-art.json > art.sha256
          while read -r _ name; do
            curl -fsSL --retry 3 -o "$name" "https://github.com/AnkiQuest/AnkiQuest-Art/releases/download/$tag/$name"
          done < art.sha256
          sha256sum -c art.sha256
