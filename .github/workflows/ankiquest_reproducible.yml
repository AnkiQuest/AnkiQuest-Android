# SPDX-License-Identifier: AGPL-3.0-only
name: ankiquest reproducible build

# Builds the release APK we ship twice from the same commit, on two runners, in
# two checkout directories and two time zones, and compares the APKs with
# diffoscope. F-Droid and IzzyOnDroid rebuild our APK and expect the same bytes (#352).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gradle/**'
      - 'gradle.properties'
      - '**/*.gradle.kts'
      - 'buildSrc/**'
      - '.github/workflows/ankiquest_reproducible.yml'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run (main pushes,
  # schedules, dispatches, merge queue) gets a group of its own and always finishes (#269).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Gradle retries HTTP 429 and 5xx, by default 3 tries 1s and 2s apart. Maven Central's rate
  # limit lasts longer than that, so try 7 times with doubling waits from 2s (about 2 minutes).
  GRADLE_OPTS: -Dorg.gradle.internal.repository.max.tentatives=7 -Dorg.gradle.internal.repository.initial.backoff=2000

jobs:
  build:
    name: Build ${{ matrix.build }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      matrix:
        include:
          - build: first
            path: first
            tz: UTC
          - build: second
            path: rebuild/second
            tz: Pacific/Auckland
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.path }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      # Same task and properties as ankiquest_apk.yml, signed with the public fallback key.
      # The build time comes from the commit, and the build cache stays off so both
      # runners compile everything themselves.
      - name: Assemble
        working-directory: ${{ matrix.path }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "fatal_warnings=false" >> local.properties
          ./gradlew :AnkiDroid:assembleFullRelease -Duniversal-apk=true --no-build-cache \
            -PcustomSuffix=quest -PcustomName="AnkiQuest"
          cp AnkiDroid/build/outputs/apk/full/release/*universal*.apk "$GITHUB_WORKSPACE/AnkiQuest-${{ matrix.build }}.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-${{ matrix.build }}
          path: AnkiQuest-${{ matrix.build }}.apk
          if-no-files-found: error

  compare:
    name: Compare with diffoscope
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apk-*
          merge-multiple: true

      # apt brings the tools diffoscope uses to unpack dex and resources. Ubuntu's diffoscope
      # cannot read APK signatures with its androguard 4, so run diffoscope from PyPI instead.
      - name: Install diffoscope
        run: |
          sudo apt-get update
          sudo apt-get install -y diffoscope apksigner apktool
          python3 -m venv "$RUNNER_TEMP/diffoscope"
          "$RUNNER_TEMP/diffoscope/bin/pip" install --quiet diffoscope==339 androguard==4.1.4 apksigcopier==1.1.1 python-magic libarchive-c
          echo "$RUNNER_TEMP/diffoscope/bin" >> "$GITHUB_PATH"

      # Decompiling every class to Java took over 25 minutes; the smali from apktool shows the
      # same differences. --timeout stops descending and reports what it found so far.
      - name: Compare
        run: |
          sha256sum AnkiQuest-*.apk
          diffoscope --exclude-command '^procyon' --exclude-command '^javap' --timeout 1500 \
            --html report.html --text report.txt AnkiQuest-first.apk AnkiQuest-second.apk

      # The job summary holds at most 1 MiB; the full report is in the artifact.
      - name: Show the differences
        if: failure()
        run: |
          [ -f report.txt ] || exit 0
          head -c 500000 report.txt
          {
            echo '```'
            head -c 60000 report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: diffoscope-report
          path: |
            report.html
            report.txt
          if-no-files-found: ignore
