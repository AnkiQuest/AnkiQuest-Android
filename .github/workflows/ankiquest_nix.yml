name: ankiquest Nix

# Builds and tests through the flake's dev shell inside the nixos/nix image.
# That image has no /lib64 loader or /usr/lib, like NixOS, so anything Gradle
# downloads that only runs on a usual Linux fails here as it would there.
# The steps are AnkiQuest-Dev's shared nix-check.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitmodules'
      - 'art'
      - 'flake.*'
      - 'gradle/**'
      - 'gradle.properties'
      - '**/*.gradle.kts'
      - 'buildSrc/**'
      - '.github/workflows/ankiquest_nix.yml'
  push:
    branches:
      - master
    paths:
      - '.gitmodules'
      - 'art'
      - 'flake.*'
      - 'gradle/**'
      - 'gradle.properties'
      - '**/*.gradle.kts'
      - 'buildSrc/**'
      - '.github/workflows/ankiquest_nix.yml'

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Every other run (master pushes,
  # schedules, dispatches, merge queue) gets a group of its own and always finishes (#269).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No setup-gradle cache here: this only runs when Gradle files change, and those changes
# change the cache key, so a cache would always miss.
jobs:
  # AnkiQuest-Dev's shared Nix check. Every command runs in the nixos/nix image.
  nixos:
    name: Build and test in the dev shell
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/nix-check.yml@master
    with:
      image: nixos/nix
      free-disk-space: true
      format: flake.nix
      timeout-minutes: 90
      # Gradle retries HTTP 429 and 5xx, by default 3 tries 1s and 2s apart. Maven Central's
      # rate limit lasts longer than that, so try 7 times with doubling waits from 2s (about
      # 2 minutes). Append: the dev shell's GRADLE_OPTS holds the aapt2 override that
      # makes aapt2 run without a /lib64 loader.
      run: |
        export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.internal.repository.max.tentatives=7 -Dorg.gradle.internal.repository.initial.backoff=2000"
        # The shared check does not check out submodules; the build reads the art/ masters.
        git submodule update --init --depth 1 art
        ./gradlew --no-daemon assemblePlayDebug
