# SPDX-License-Identifier: AGPL-3.0-or-later
# The README banner (docs/graphics/logos/banner_readme.png) and the social preview, drawn by
# AnkiQuest-Dev's shared ankiquest-banner from docs/graphics/banner.toml: the five screens
# AnkiquestBannerScreenshots records and the duo master at the pinned server commit.
#
# A pull request touching them or their inputs fails unless the committed images have the drawn
# pixels; the drawings are uploaded as the `banner` artifact. A release tag proposes new images to
# master as a pull request; a manual run proposes them to the branch it ran on.
name: ankiquest README banner

on:
  push:
    tags: ["quest-*"]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ankiquest_banner.yml'
      - 'AnkiDroid/src/test/java/com/ichi2/anki/ankiquest/AnkiquestBannerScreenshots.kt'
      - 'ankiquest-core/src/test/resources/ankiquest-server.sha'
      - 'ankiquest-art.json'
      - 'docs/graphics/banner.toml'
      - 'docs/graphics/logos/banner_readme.png'
      - 'docs/graphics/logos/social_preview.png'

permissions: {}

concurrency:
  # The newest run for a ref wins: a pull request, a manual run on a branch or a tag redraws the
  # same images, so an older run's result is never needed. It never runs on a push to master.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: -Dkotlin.daemon.options=autoshutdownIdleSeconds=10
  # Gradle retries HTTP 429 and 5xx, by default 3 tries 1s and 2s apart. Maven Central's rate
  # limit lasts longer than that, so try 7 times with doubling waits from 2s (about 2 minutes).
  GRADLE_OPTS: -Dorg.gradle.internal.repository.max.tentatives=7 -Dorg.gradle.internal.repository.initial.backoff=2000

jobs:
  # The screens are not committed: Roborazzi records them here and passes them on.
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Work around Ubuntu 26.04's RAM-backed /tmp until the image fix rolls out.
      # https://github.com/actions/runner-images/pull/14814
      - name: Keep /tmp on disk
        run: |
          if [ "$(findmnt -n -o FSTYPE --target /tmp)" = "tmpfs" ]; then
            sudo systemctl mask tmp.mount
            sudo umount -l /tmp
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          gradle-version: wrapper

      - name: Robolectric SDK cache
        uses: ./.github/actions/robolectric-sdk-cache

      - name: Download Robolectric and compile
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          retry_wait_seconds: 60
          max_attempts: 3
          command: ./gradlew robolectricSdkDownload compileScreenshotTests -Pscreenshot --daemon

      # The record command in docs/graphics/banner.toml.
      - name: Record the screens
        run: ./gradlew :AnkiDroid:recordRoborazziPlayDebug -Pscreenshot -PreadmeBanner --tests '*AnkiquestBannerScreenshots*'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: banner-screens
          path: AnkiDroid/build/outputs/roborazzi/AnkiquestBannerScreenshots/*.png
          if-no-files-found: error

  # Draws both images from the screens and compares them with the committed ones. Pull requests
  # fail when an image is stale; releases and manual runs report it to the propose job.
  banner:
    needs: record
    permissions:
      contents: read
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/banner.yml@master
    with:
      screens-artifact: banner-screens
      screens-path: AnkiDroid/build/outputs/roborazzi/AnkiquestBannerScreenshots
      on-stale: ${{ github.event_name == 'pull_request' && 'fail' || 'report' }}

  propose:
    needs: banner
    if: github.event_name != 'pull_request' && needs.banner.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Writes go through UPSTREAM_SYNC_TOKEN: a pull request opened or pushed with GITHUB_TOKEN
    # starts no CI, so it could never pass the required checks (#270).
    permissions:
      contents: read
    steps:
      - name: Require the sync token
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo "::error::Set UPSTREAM_SYNC_TOKEN: a token for this repository with Contents and Pull requests read and write. Pull requests opened with GITHUB_TOKEN start no CI."
            exit 1
          fi

      # A release proposes to master, a manual run to the branch it ran on.
      - name: Choose the base branch
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then base="$BRANCH"; else base=master; fi
          echo "branch=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.branch }}
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banner
          path: ${{ runner.temp }}/banner

      # Push the banner branch, then open its pull request unless one is already open. Any
      # failure fails the job, so a banner that never reaches its base is visible (#270).
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          BASE: ${{ steps.base.outputs.branch }}
          SOURCE: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cp "$RUNNER_TEMP/banner/banner_readme.png" "$RUNNER_TEMP/banner/social_preview.png" docs/graphics/logos/
          if [[ "$GITHUB_REF" == refs/tags/quest-* ]]; then branch="banner-$SOURCE"; else branch="banner-run-$RUN_ID"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "README banner for $SOURCE" -- docs/graphics/logos/banner_readme.png docs/graphics/logos/social_preview.png
          git push --force origin "$branch"

          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Pull request #$open already proposes $branch"
            exit 0
          fi

          body="The README banner and social preview drawn from $SOURCE by AnkiQuest-Dev's ankiquest-banner ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID))."
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$branch" \
            --title "README banner for $SOURCE" --body "$body"
